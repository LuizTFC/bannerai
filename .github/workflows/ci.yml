name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bannerai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bannerai
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bannerai_test
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @bannerai/shared
      - run: npm run typecheck -w apps/api
      - run: npm run typecheck -w apps/web
      - run: npm run lint -w apps/web
      - run: npm run test -w apps/api
      - run: npm run build -w apps/web
